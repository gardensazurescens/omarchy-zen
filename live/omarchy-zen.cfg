// Omarchy Zen live reload (autoconfig; the first line must be a comment).
//
// Polls <profile>/chrome/custom-zen.css once per second and, when it changes,
// re-registers its --custom-zen-* variables as an !important user sheet. Every
// rule in zen-auto-style-*.css reads those variables, so the new palette
// repaints chrome, about: pages and selection instantly without a restart.
//
// It additionally mirrors the same palette into Dark Reader's `theme` settings
// (dark/light scheme background + text, and selection), so website content
// follows the active Omarchy theme too. Dark Reader only reads its settings at
// startup, so after writing we `reload()` the extension, which re-reads them.
//
// Dark Reader's parent Extension object is registered a little after
// final-ui-startup, so the sync retries on each tick until it appears.
//
// Profiles without the Omarchy Zen stylesheet are left untouched. Failures are
// reported to the Browser Console and never block startup.
try {
  (() => {
    const POLL_MS = 1000;
    const MAX_DARKREADER_ATTEMPTS = 120; // ~2 min of 1s ticks

    // Dark Reader sync. Set DARKREADER.enabled to false to leave Dark Reader
    // alone entirely; syncSettingsOff forces storage.local (needed so the
    // written theme is the one that is actually read).
    const DARKREADER = {
      enabled: true,
      id: "addon@darkreader.org",
      syncSettingsOff: true,
    };

    const { setInterval } = ChromeUtils.importESModule(
      "resource://gre/modules/Timer.sys.mjs"
    );
    // NB: Firefox 156 folded IOUtils into FileUtils; the old
    // resource://gre/modules/IOUtils.sys.mjs no longer exists and importing it
    // aborts autoconfig entirely.
    const { FileUtils } = ChromeUtils.importESModule(
      "resource://gre/modules/FileUtils.sys.mjs"
    );

    // Error-only log (ProfD/omarchy-zen-dr.log). Best-effort, never throws.
    const reportError = (msg, err) => {
      try {
        const text = `${Date.now()} ${msg}${err ? ` :: ${err} :: ${err.stack}` : ""}\n`;
        const file = Services.dirsvc.get("ProfD", Ci.nsIFile);
        file.append("omarchy-zen-dr.log");
        const stream = FileUtils.openFileOutputStream(
          file,
          FileUtils.MODE_WRONLY | FileUtils.MODE_CREATE | FileUtils.MODE_APPEND
        );
        const conv = Cc[
          "@mozilla.org/intl/converter-output-stream;1"
        ].createInstance(Ci.nsIConverterOutputStream);
        conv.init(stream, "UTF-8");
        conv.writeString(text);
        conv.flush();
        conv.close();
      } catch (e) {}
      if (err) {
        Cu.reportError(err);
      } else {
        Cu.reportError(`omarchy-zen: ${msg}`);
      }
    };

    const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(
      Ci.nsIStyleSheetService
    );
    let registered = null;
    let lastKey = null;
    let lastWant = null;
    let darkReaderDone = false;
    let darkReaderAttempts = 0;
    let darkReaderBusy = false;

    const apply = css => {
      const important = css.replace(
        /(--custom-zen-[\w-]+\s*:[^;!{}]+);/g,
        "$1 !important;"
      );
      const uri = Services.io.newURI(
        "data:text/css;charset=utf-8," + encodeURIComponent(important)
      );
      sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
      if (registered && sss.sheetRegistered(registered, sss.USER_SHEET)) {
        sss.unregisterSheet(registered, sss.USER_SHEET);
      }
      registered = uri;
    };

    const readVar = (css, name) => {
      const match = css.match(
        new RegExp(`--custom-zen-${name}\\s*:\\s*([^;]+);`)
      );
      return match ? match[1].trim() : null;
    };

    // Map the rendered custom-zen.css palette onto Dark Reader's colour set.
    const paletteFromCss = css => {
      const background = readVar(css, "bg");
      const text = readVar(css, "fg");
      const selection = readVar(css, "selection-bg");
      const scheme = readVar(css, "color-scheme");
      if (!background || !text) return null;
      return {
        background,
        text,
        selection: selection || background,
        mode: scheme === "light" ? 0 : 1,
      };
    };

    const themeMatches = (theme, want) =>
      theme &&
      theme.engine === "dynamicTheme" &&
      theme.darkSchemeBackgroundColor === want.background &&
      theme.darkSchemeTextColor === want.text &&
      theme.lightSchemeBackgroundColor === want.background &&
      theme.lightSchemeTextColor === want.text &&
      theme.selectionColor === want.selection &&
      theme.mode === want.mode;

    const syncDarkReader = async want => {
      if (!DARKREADER.enabled || darkReaderBusy || darkReaderDone) return;
      if (darkReaderAttempts >= MAX_DARKREADER_ATTEMPTS) return;
      darkReaderBusy = true;
      darkReaderAttempts++;
      try {
        const [{ AddonManager }, { ExtensionParent }, { ExtensionStorageIDB }] =
          await Promise.all([
            ChromeUtils.importESModule(
              "resource://gre/modules/AddonManager.sys.mjs"
            ),
            ChromeUtils.importESModule(
              "resource://gre/modules/ExtensionParent.sys.mjs"
            ),
            ChromeUtils.importESModule(
              "resource://gre/modules/ExtensionStorageIDB.sys.mjs"
            ),
          ]);

        // Not registered yet during startup: retry on a later tick.
        const extension =
          ExtensionParent.GlobalManager.getExtension(DARKREADER.id);
        if (!extension) return;

        const addon = await AddonManager.getAddonByID(DARKREADER.id);
        if (!addon || !addon.isActive || addon.userDisabled) {
          darkReaderDone = true; // user's choice; stop retrying
          return;
        }

        // The storage.local IDB lives under a reserved user context id; the
        // module builds the matching principal for us.
        const principal = ExtensionStorageIDB.getStoragePrincipal(extension);
        const conn = await ExtensionStorageIDB.open(
          principal,
          extension.hasPermission("unlimitedStorage")
        );

        const { theme = {} } = await conn.get({ theme: {} });
        if (themeMatches(theme, want)) {
          darkReaderDone = true;
          return;
        }

        const changes = {
          theme: Object.assign({}, theme, {
            engine: "dynamicTheme",
            darkSchemeBackgroundColor: want.background,
            darkSchemeTextColor: want.text,
            lightSchemeBackgroundColor: want.background,
            lightSchemeTextColor: want.text,
            selectionColor: want.selection,
            mode: want.mode,
          }),
        };
        if (DARKREADER.syncSettingsOff) changes.syncSettings = false;

        // Write first, then reload: reload() disables+enables the add-on and
        // flushes its cache, so the background re-reads the new settings.
        await conn.set(changes);
        if (typeof addon.reload === "function") {
          await addon.reload();
        } else {
          addon.userDisabled = true;
          addon.userDisabled = false;
        }
        darkReaderDone = true;
      } catch (e) {
        reportError("dark reader sync failed", e);
        darkReaderDone = true; // log once; don't spam retries on real errors
      } finally {
        darkReaderBusy = false;
      }
    };

    // nsIFile follows the chrome/custom-zen.css symlink, so a theme switch
    // that swaps the target file is seen as a new mtime/size.
    const poll = file => {
      try {
        const key = `${file.lastModifiedTime}:${file.fileSize}`;
        if (key === lastKey) return;
        const css = Cu.readUTF8File(file);
        lastKey = key;
        if (!css.includes("--custom-zen-")) return;
        apply(css);
        const want = paletteFromCss(css);
        if (want) {
          lastWant = want;
          darkReaderDone = false; // new palette: re-sync
          darkReaderAttempts = 0;
          syncDarkReader(want);
        }
      } catch (e) {
        // Missing or half-written sheet during a theme switch: retry next tick.
        lastKey = null;
      }
    };

    const tick = () => {
      if (lastWant && !darkReaderDone) syncDarkReader(lastWant);
    };

    const start = () => {
      Services.obs.removeObserver(start, "final-ui-startup");
      const chrome = Services.dirsvc.get("ProfD", Ci.nsIFile);
      chrome.append("chrome");
      const marker = chrome.clone();
      marker.append("zen-auto-style-chrome.css");
      if (!marker.exists()) return;
      const file = chrome.clone();
      file.append("custom-zen.css");
      poll(file);
      setInterval(() => poll(file.clone()), POLL_MS);
      setInterval(tick, POLL_MS);
    };
    Services.obs.addObserver(start, "final-ui-startup");
  })();
} catch (e) {
  Cu.reportError(e);
}
